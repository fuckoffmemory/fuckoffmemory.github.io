<head>

    <style>
        * {

            box-sizing: border-box;

        }

        body {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;

            justify-content: center;

        #fireflies {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            z-index: -1;

        .adapter-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .adapter-visual {
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #333, #fff, #333);
            border-radius: 4px;
            margin-bottom: 30px;
            position: relative;
        }

        .adapter-visual::before, .adapter-visual::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            top: -2px;
        }
        
        .adapter-visual::before { left: 10px; background: #000; }
        .adapter-visual::after { right: 10px; background: #fff; }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #fff;
            padding: 3px;
            margin-bottom: 20px;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {

            color: #888;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;

        .link-btn {

        .link-btn:hover {

        .link-btn span {

    <canvas id="fireflies"></canvas>

    <script>
        const canvas = document.getElementById('fireflies');
        const ctx = canvas.getContext('2d');
        let width, height;
        let fireflies = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Firefly {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.fadeSpeed = Math.random() * 0.02 + 0.005;
                this.growing = Math.random() > 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.growing) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 1) this.growing = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.growing = true;
                }
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "white";
                ctx.fill();
                ctx.closePath();
            }
        }

        for (let i = 0; i < 80; i++) {
            fireflies.push(new Firefly());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            fireflies.forEach(firefly => {
                firefly.update();
                firefly.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
